<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Document Intelligence AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    height:100vh;
    overflow:hidden;
}

/* ================= LAYOUT ================= */

.app{
    display:flex;
    height:100vh;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:260px;
    background:#171717;
    border-right:1px solid #2d2d2d;
    display:flex;
    flex-direction:column;
    padding:20px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.new-chat-btn{
    background:#2a2a2a;
    border:none;
    color:white;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    margin-bottom:20px;
    transition:0.2s;
}

.new-chat-btn:hover{
    background:#3a3a3a;
}

.chat-history{
    flex:1;
    overflow-y:auto;
}

.chat-item{
    padding:12px;
    margin-bottom:10px;
    border-radius:10px;
    cursor:pointer;
    background:#1f1f1f;
    color:#ccc;
    transition:0.2s;
}

.chat-item:hover{
    background:#2a2a2a;
}

.sidebar-footer{
    padding-top:10px;
    border-top:1px solid #2d2d2d;
    color:#888;
    font-size:14px;
}

/* ================= MAIN CHAT ================= */

.main-chat{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* ================= CHAT AREA ================= */

.chat-area{
    flex:1;
    overflow-y:auto;
    padding:40px 20px 140px;
    max-width:900px;
    width:100%;
    margin:auto;
}

.welcome{
    text-align:center;
    margin-top:120px;
}

.welcome h1{
    font-size:40px;
    margin-bottom:10px;
}

.welcome p{
    color:#999;
    font-size:18px;
}

/* ================= CHAT MESSAGES ================= */

.message{
    margin-bottom:24px;
    display:flex;
    flex-direction:column;
}

.user-message{
    align-self:flex-end;
    background:#2563eb;
    color:white;
    padding:14px 18px;
    border-radius:18px;
    max-width:75%;
    line-height:1.6;
}

.bot-message{
    align-self:flex-start;
    background:#1f1f1f;
    color:#f1f1f1;
    padding:16px 20px;
    border-radius:18px;
    max-width:80%;
    line-height:1.7;
    border:1px solid #2d2d2d;
}

/* ================= INPUT AREA ================= */

.input-container{
    position:fixed;
    bottom:0;
    left:260px;
    right:0;
    padding:20px;
    background:linear-gradient(to top,#0f0f0f 80%,transparent);
}

.input-wrapper{
    max-width:900px;
    margin:auto;
    background:#1b1b1b;
    border:1px solid #333;
    border-radius:18px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

.upload-btn{
    background:#2d2d2d;
    border:none;
    color:white;
    width:42px;
    height:42px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.upload-btn:hover{
    background:#3a3a3a;
}

#queryInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:16px;
}

.send-btn{
    background:#2563eb;
    border:none;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}

.send-btn:hover{
    background:#1d4ed8;
}

/* ================= FILE INFO ================= */

.file-info{
    color:#aaa;
    font-size:14px;
    margin-top:8px;
    text-align:center;
}

/* ================= LOADING ================= */

.typing{
    display:flex;
    gap:5px;
    padding:10px 0;
}

.typing span{
    width:8px;
    height:8px;
    background:#999;
    border-radius:50%;
    animation:blink 1.4s infinite;
}

.typing span:nth-child(2){
    animation-delay:0.2s;
}

.typing span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes blink{
    0%,100%{
        opacity:0.3;
    }
    50%{
        opacity:1;
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    .sidebar{
        display:none;
    }

    .input-container{
        left:0;
    }

    .chat-area{
        padding:20px 15px 130px;
    }

    .welcome h1{
        font-size:30px;
    }
}

</style>
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="logo">
            📄 DocuMind AI
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            + New Chat
        </button>

        <div class="chat-history" id="chatHistory">

            <div class="chat-item">
                Research Paper.pdf
            </div>

            <div class="chat-item">
                AI Notes
            </div>

            <div class="chat-item">
                Machine Learning
            </div>

        </div>

        <div class="sidebar-footer">
            Powered by RAG + LLM
        </div>

    </div>

    <!-- ================= MAIN CHAT ================= -->

    <div class="main-chat">

        <div class="chat-area" id="chatArea">

            <div class="welcome" id="welcomeScreen">
                <h1>Document Intelligence AI</h1>
                <p>Upload a document and ask intelligent questions</p>
            </div>

        </div>

        <!-- ================= INPUT ================= -->

        <div class="input-container">

            <div class="input-wrapper">

                <input type="file" id="pdfFile" hidden>

                <button class="upload-btn" id="uploadBtn">
                    📎
                </button>

                <button id ="removeDocBtn">
                    Remove Document
    
                </button>

                <input
                    type="text"
                    id="queryInput"
                    placeholder="Ask anything about your document..."
                >

                <button class="send-btn" id="sendBtn">
                    Send
                </button>

            </div>

            <div class="file-info" id="fileInfo"></div>

        </div>

    </div>

</div>

<script>

/* ================= ELEMENTS ================= */

const uploadBtn = document.getElementById("uploadBtn");
const pdfFile = document.getElementById("pdfFile");
const fileInfo = document.getElementById("fileInfo");

const sendBtn = document.getElementById("sendBtn");
const queryInput = document.getElementById("queryInput");

const chatArea = document.getElementById("chatArea");
const welcomeScreen = document.getElementById("welcomeScreen");

const newChatBtn = document.getElementById("newChatBtn");

/* ================= UPLOAD ================= */

uploadBtn.addEventListener("click", () => {
    pdfFile.click();
});

pdfFile.addEventListener("change", () => {

    const file = pdfFile.files[0];

    if(!file) return;

    fileInfo.innerHTML = `📄 Wait file is Uploading...: ${file.name}`;

    const formData = new FormData();
    formData.append("pdf", file);

    fetch("/upload", {
        method:"POST",
        body:formData
    })
    .then(res => res.json())
    .then(data => {
        fileInfo.innerHTML = `✅ ${file.name} processed successfully`;
    })
    .catch(err => {
        fileInfo.innerHTML = `❌ Upload failed`;
    });

});

const removeDocBtn = document.getElementById("removeDocBtn");

removeDocBtn.addEventListener("click", async () => {

    try {

        const response = await fetch("/remove-doc", {
            method: "POST"
        });

        const data = await response.json();

        // Show message in chatbot
        chatArea.innerHTML += `
            <div class="message">
                <div class="bot-message">
                    ${data.msg}
                </div>
            </div>
        `;

        scrollBottom();

    } catch (error) {

        console.error(error);

        chatArea.innerHTML += `
            <div class="message">
                <div class="bot-message">
                    ❌ Failed to remove document
                </div>
            </div>
        `;

    }

});

/* ================= SEND MESSAGE ================= */

sendBtn.addEventListener("click", sendMessage);

queryInput.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        sendMessage();
    }
});

async function sendMessage() {

    const query = queryInput.value.trim();
    if (!query) return;

    welcomeScreen.style.display = "none";

    const msgId = "msg-" + Date.now();

    /* USER MESSAGE */
    chatArea.innerHTML += `
        <div class="message">
            <div class="user-message">
                ${query}
            </div>
        </div>
    `;

    /* BOT MESSAGE CONTAINER */
    chatArea.innerHTML += `
        <div class="message">
            <div class="bot-message" id="${msgId}">
                <div class="typing">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>
    `;

    scrollBottom();

    const response = await fetch("/ask", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ query })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    let result = "";

    const botMessage = document.getElementById(msgId);

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        result += decoder.decode(value);
        botMessage.innerText = result;
    }

    queryInput.value = "";
}

/* ================= NEW CHAT ================= */

newChatBtn.addEventListener("click", () => {

    chatArea.innerHTML = `
        <div class="welcome" id="welcomeScreen">
            <h1>Document Intelligence AI</h1>
            <p>Upload a document and ask intelligent questions</p>
        </div>
    `;

});

/* ================= AUTO SCROLL ================= */

function scrollBottom(){
    chatArea.scrollTop = chatArea.scrollHeight;
}

</script>

</body>
</html>
