name: RAG System CI Pipeline

on:
  push:
    branches: ["main", "ci-cd"]
  pull_request:
    branches: ["main"]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        runs: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run basic import test
        run: | 
          python -c "import flask , langchain; print('Imports OK')"